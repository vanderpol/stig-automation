---
# Crunchy Data Postgres 16 STIG V1R3
postgres16_stig_enabled: true

# Discovery / connection. The role asks PostgreSQL for its actual paths.
postgres16_psql_bin: psql
postgres16_admin_user: postgres
postgres16_admin_db: postgres

# Safety gates.
# V-261857 is organization-defined. Empty means fail the applicable
# remediation prerequisite rather than inventing a connection limit.
postgres16_max_connections: null
postgres16_role_connection_limits: {}

# Audit baseline required by the V1R3 pgAudit family. Additional
# organization-defined audit classes may be appended explicitly.
postgres16_pgaudit_required_classes:
  - ddl
  - role
  - read
  - write
postgres16_pgaudit_additional_classes: []
postgres16_pgaudit_log_catalog: "on"

# Literal current-check minimum for V-261860.
postgres16_log_line_prefix: "< %m %a %u %d %r %p %i %e %s %c >"

# V-261899 session termination/keepalive values. These STIG checks require
# nonzero values; defaults follow the benchmark's example and remain tunable.
postgres16_statement_timeout_ms: 10000
postgres16_tcp_keepalives_idle: 10
postgres16_tcp_keepalives_interval: 10
postgres16_tcp_keepalives_count: 10

# V-261921 uses UTC as the safe common reference by default.
postgres16_log_timezone: "UTC"

# Central logging is organization-owned. Supplying an approved facility enables
# guarded PostgreSQL syslog configuration; offload/receiver evidence is still required.
postgres16_syslog_facility: null
postgres16_syslog_ident: "postgres"
postgres16_central_log_evidence: null

# Site-owned evidence / approved-state inputs.
postgres16_approved_superusers: []
postgres16_approved_auth_methods: []
postgres16_authorization_evidence: null
postgres16_pki_evidence: null
postgres16_fips_evidence: null
postgres16_patch_evidence: null
postgres16_at_rest_protection_evidence: null
