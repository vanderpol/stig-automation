---
# These tasks make non-deterministic requirements explicit and executable.
# They deliberately do not convert missing organization/application decisions
# into fabricated configuration.

- name: PostgreSQL 16 STIG | Require organization access-control evidence
  ansible.builtin.debug:
    msg: >-
      Organization-approved authentication, authorization, role ownership,
      account identity, privilege boundaries, PPSM values, and connection/session
      limits must be reconciled to observed PostgreSQL state. The role will not
      invent those decisions.
  tags:
    - V-261857
    - V-261858
    - V-261859
    - V-261862
    - V-261882
    - V-261884
    - V-261885
    - V-261889
    - V-261890
    - V-261897
    - V-261898
    - V-261914
    - V-261915
    - V-261923
    - V-261924
    - V-261926

- name: PostgreSQL 16 STIG | Require application and database-design evidence
  ansible.builtin.debug:
    msg: >-
      These controls depend on application/schema behavior, source-code review,
      security-label handling, reauthentication, or documented invalid-input
      behavior. Host-level Ansible cannot establish compliance without the
      corresponding application evidence and functional tests.
  tags:
    - V-261902
    - V-261905
    - V-261906
    - V-261907
    - V-261909
    - V-261910
    - V-261911
    - V-261912
    - V-261913
    - V-261916
    - V-261927
    - V-261934

- name: PostgreSQL 16 STIG | Require audit infrastructure evidence
  ansible.builtin.debug:
    msg: >-
      Audit-failure response, capacity, utilization alerts, real-time failure
      notification, and centralized offload require organization monitoring and
      log-management integration. PostgreSQL state is collected separately, but
      the enterprise service and notification evidence remain site-owned.
  tags:
    - V-261873
    - V-261874
    - V-261917
    - V-261918
    - V-261919
    - V-261920
    - V-261967

- name: PostgreSQL 16 STIG | Require PKI and transport-protection evidence
  ansible.builtin.debug:
    msg: >-
      Certificate authority approval, CRLs, private-key access, certificate
      identity mapping, TLS end-to-end boundaries, and any classified-network
      encryption devices must be supplied by the site. No trust anchor, key,
      certificate, or classified-system assumption is generated by this role.
  tags:
    - V-261893
    - V-261894
    - V-261895
    - V-261900
    - V-261928
    - V-261929
    - V-261932
    - V-261933

- name: PostgreSQL 16 STIG | Require data-at-rest protection evidence
  ansible.builtin.debug:
    msg: >-
      Data-owner requirements determine what information requires at-rest
      confidentiality/integrity protection and whether the approved mechanism
      is database, filesystem, disk, or physical. pgcrypto availability alone
      is not proof that required data is protected.
  tags:
    - V-261901
    - V-261930
    - V-261931

- name: PostgreSQL 16 STIG | Require software and filesystem governance evidence
  ansible.builtin.debug:
    msg: >-
      Package/component baselines, external executables, dedicated software
      locations, file ownership, patch timelines, and vendor support must be
      reconciled with the approved platform/package source. Destructive
      extension removal, relocation, and blind upgrades are intentionally
      excluded.
  tags:
    - V-261878
    - V-261880
    - V-261881
    - V-261883
    - V-261886
    - V-261887
    - V-261888
    - V-261904
    - V-261935
    - V-261936
    - V-283674

- name: PostgreSQL 16 STIG | Require FIPS and cryptographic-module evidence
  ansible.builtin.debug:
    msg: >-
      Host FIPS state is observed, but enabling FIPS is a platform lifecycle
      action rather than a safe database-role change. Validate the approved
      cryptographic module and data-owner requirements separately.
  tags:
    - V-261896
    - V-261965
    - V-261966

- name: PostgreSQL 16 STIG | Require negative audit-event verification
  ansible.builtin.debug:
    msg: >-
      These findings require demonstrating that denied/failed operations produce
      audit records. Configuration is necessary but not sufficient; execute the
      STIG-prescribed negative tests against a disposable test database and
      retain the resulting audit evidence.
  tags:
    - V-261864
    - V-261925
    - V-261939
    - V-261941
    - V-261943
    - V-261945
    - V-261947
    - V-261949
    - V-261951
    - V-261953
    - V-261955
    - V-261957
    - V-261963

- name: PostgreSQL 16 STIG | Require organization-defined audit-detail evidence
  ansible.builtin.debug:
    msg: >-
      The baseline audit configuration captures the current STIG minimums.
      Any additional organization-defined audit content, shared-account
      attribution, or local event requirements must be supplied and tested.
  tags:
    - V-261872

- name: PostgreSQL 16 STIG | Require documented data-transfer procedure evidence
  ansible.builtin.debug:
    msg: >-
      Data-transfer policy and procedures are organizational controls. Attach the
      approved procedure/evidence rather than manufacturing a database setting.
  tags:
    - V-261903
