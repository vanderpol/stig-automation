---
- name: Validate nginx configuration
  ansible.builtin.command: "{{ nginx_stig_binary }} -t -c {{ nginx_stig_main_conf }}"
  changed_when: false
  listen: validate nginx

- name: Reload nginx
  ansible.builtin.service:
    name: "{{ nginx_stig_service }}"
    state: reloaded
  listen: reload nginx
