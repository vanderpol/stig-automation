---
# Supported/test scope for v1.0: RHEL 8 and RHEL 9, Tomcat 9 only.
tomcat_user: tomcat
tomcat_group: tomcat
tomcat_service: tomcat

# auto = detect Red Hat RPM layout first, then standard Apache CATALINA_BASE layout.
tomcat_layout: auto
tomcat_home: ""
tomcat_base: ""
tomcat_conf_dir: ""
tomcat_webapps_dir: ""
tomcat_logs_dir: ""
tomcat_temp_dir: ""
tomcat_work_dir: ""
tomcat_bin_dir: ""
tomcat_lib_dir: ""
tomcat_systemd_dropin_dir: "/etc/systemd/system/{{ tomcat_service }}.service.d"

tomcat_stig_audit_only: false
tomcat_stig_restart: true
tomcat_stig_manage_xml: true
tomcat_stig_production: true

# SSP / ISSO inputs. Empty values are deliberately NOT guessed.
tomcat_stig_manager_max_active_sessions: null
tomcat_stig_manager_session_timeout_minutes: 10
tomcat_stig_hsts_include_subdomains: false
tomcat_stig_behind_proxy: false
tomcat_stig_internal_proxies_regex: ""
tomcat_stig_approved_connector_ports: []
tomcat_stig_enforce_approved_connectors: false
tomcat_stig_connector_addresses: {}
tomcat_stig_approved_privileged_contexts: []
tomcat_stig_remove_default_root: true
tomcat_stig_allow_deployxml: false
tomcat_stig_allow_autodeploy: false
tomcat_stig_allow_backslash_exception: false
tomcat_stig_strict_servlet_exception: false

# Explicit acknowledgement required because V3R4's server.xml-visible management Realm
# is inherited by applications that do not define their own Realm.
tomcat_stig_replace_engine_realm_for_management: false
tomcat_stig_ldap_enabled: false
tomcat_stig_ldap_connection_url: ""
tomcat_stig_ldap_user_base: ""
tomcat_stig_ldap_user_search: ""
tomcat_stig_ldap_role_base: ""
tomcat_stig_ldap_role_name: "cn"
tomcat_stig_ldap_role_search: ""
# Optional bind identity/secret for JNDIRealm. Store passwords in Vault, not source.
tomcat_stig_ldap_connection_name: ""
tomcat_stig_ldap_connection_password: ""
tomcat_stig_management_user_approval_evidence: ""
# V-222970: choose one representation matching the SSP. CIDR values are preferred when practical.
tomcat_stig_management_allowed_cidrs: []
tomcat_stig_management_allowed_cidr_regex: ""

tomcat_stig_remote_jmx_enabled: false
tomcat_stig_jmx_port: 9010
tomcat_stig_jmx_bind_address: "127.0.0.1"
tomcat_stig_jmx_password_file: ""
tomcat_stig_jmx_access_file: ""
tomcat_stig_jmx_ssl_keystore: ""
tomcat_stig_jmx_ssl_keystore_password: ""

tomcat_keystore_file: ""
tomcat_keystore_type: "PKCS12"
tomcat_keystore_current_password: ""
tomcat_keystore_new_password: ""
tomcat_keystore_password: ""
tomcat_keystore_default_passwords: [changeit, changeme, tomcat]
tomcat_truststore_file: ""
tomcat_truststore_password: ""
tomcat_dod_ca_bundle: ""

tomcat_stig_cluster_enabled: false
tomcat_stig_cluster_trusted_network_documented: false
tomcat_stig_proxy_mutual_tls_required: false
tomcat_stig_proxy_mutual_tls_evidence: ""
tomcat_stig_proxy_mutual_tls_risk_acceptance: ""
# When mutual TLS is required, list the application web.xml files served by the proxied connector(s).
# These files will have <auth-method>CLIENT-CERT</auth-method> enforced.
tomcat_stig_proxy_client_cert_web_xml_files: []

# V-222968: only enable after the RHEL/Java cryptographic stack is configured for FIPS.
tomcat_stig_fips_enabled: false
tomcat_stig_fips_platform_evidence: ""

# V-222974: EncryptInterceptor is not generated automatically because it requires a
# cluster-wide pre-shared key and coordinated rollout. Document a trusted/private
# cluster network or configure encryption under site change control.
tomcat_stig_cluster_encryption_evidence: ""

tomcat_stig_approved_webapps: []
tomcat_stig_high_availability_required: false
tomcat_stig_ha_evidence: ""
tomcat_stig_audit_failure_alerting_documented: false
