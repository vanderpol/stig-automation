---
- name: "V-223009 | Read active connector ports"
  ansible.builtin.shell: |
    python3 - "{{ tomcat_conf_dir_resolved }}/server.xml" <<'PY'
    import sys, xml.etree.ElementTree as ET
    root = ET.parse(sys.argv[1]).getroot()
    for connector in root.findall('.//Connector'):
        print(connector.get('port',''))
    PY
  args:
    executable: /bin/bash
  register: tomcat_stig_connector_ports_detected
  changed_when: false
  tags: [V-223009]

- name: "V-223009 | Require SSP-approved address for every active connector"
  ansible.builtin.assert:
    that:
      - item | string in (tomcat_stig_connector_addresses.keys() | map('string') | list)
    fail_msg: >-
      Active connector port {{ item }} has no SSP-approved address in tomcat_stig_connector_addresses.
      Current V3R4 requires an explicit approved address on every Connector.
  loop: "{{ tomcat_stig_connector_ports_detected.stdout_lines | reject('equalto','') | list }}"
  tags: [V-223009]

- name: "V-223009 | Reject empty connector-address mappings"
  ansible.builtin.assert:
    that:
      - item.value | string | length > 0
    fail_msg: "tomcat_stig_connector_addresses contains an empty address for connector key {{ item.key }}."
  loop: "{{ tomcat_stig_connector_addresses | dict2items }}"
  tags: [V-223009]

- name: "V-222968 | Require FIPS-ready platform before Tomcat remediation"
  ansible.builtin.assert:
    that:
      - tomcat_stig_fips_enabled | bool
      - tomcat_stig_fips_platform_evidence | length > 0
    fail_msg: >-
      V-222968 is a current CAT I requirement and cannot be silently skipped. Configure the
      RHEL/Java cryptographic stack to use approved FIPS-validated modules, document that
      configuration in tomcat_stig_fips_platform_evidence, then set
      tomcat_stig_fips_enabled=true. The role will not claim or manufacture platform FIPS status.
  tags: [V-222968]

- name: "V-222974 | Require trusted-network or encryption evidence for clustered Tomcat"
  ansible.builtin.assert:
    that:
      - tomcat_stig_cluster_trusted_network_documented | bool or tomcat_stig_cluster_encryption_evidence | length > 0
    fail_msg: >-
      Tomcat clustering is enabled. Document the private/trusted cluster network or provide
      evidence of a correctly coordinated EncryptInterceptor deployment. The role will not
      invent or distribute a cluster-wide pre-shared encryption key.
  when: tomcat_stig_cluster_enabled | bool
  tags: [V-222974]

- name: "V-222971 | Require proxy mutual-authentication decision/evidence"
  ansible.builtin.assert:
    that:
      - >-
        tomcat_stig_proxy_mutual_tls_risk_acceptance | length > 0 or
        (tomcat_stig_proxy_mutual_tls_required | bool and tomcat_stig_proxy_mutual_tls_evidence | length > 0)
    fail_msg: >-
      Tomcat is documented behind a proxy/load balancer. Current V3R4 requires mutual
      authentication unless an approved risk acceptance/RMF determination documents otherwise.
      Supply either tomcat_stig_proxy_mutual_tls_evidence for implemented mutual TLS or
      tomcat_stig_proxy_mutual_tls_risk_acceptance.
  when: tomcat_stig_behind_proxy | bool
  tags: [V-222971]


- name: "V-222968 | Configure AprLifecycleListener FIPSMode when explicitly enabled"
  ansible.builtin.shell: |
    python3 - "{{ tomcat_conf_dir_resolved }}/server.xml" <<'PY'
    import sys, xml.etree.ElementTree as ET
    path=sys.argv[1]
    tree=ET.parse(path); root=tree.getroot(); changed=False
    listener=None
    for e in root.findall("Listener"):
        if e.get("className")=="org.apache.catalina.core.AprLifecycleListener":
            listener=e; break
    if listener is None:
        listener=ET.Element("Listener")
        listener.set("className","org.apache.catalina.core.AprLifecycleListener")
        root.insert(0,listener); changed=True
    for k,v in (("SSLEngine","on"),("FIPSMode","on")):
        if listener.get(k)!=v:
            listener.set(k,v); changed=True
    if changed:
        tree.write(path,encoding="UTF-8",xml_declaration=True)
    print("CHANGED" if changed else "OK")
    PY
  args:
    executable: /bin/bash
  register: tomcat_stig_fips_xml_result
  changed_when: "'CHANGED' in tomcat_stig_fips_xml_result.stdout"
  when: tomcat_stig_fips_enabled | bool
  notify: restart tomcat
  tags: [V-222968]

- name: "V-222971 | Require explicit connector and application targets when proxy mutual TLS is required"
  ansible.builtin.assert:
    that:
      - tomcat_stig_proxy_connector_ports | length > 0
      - tomcat_stig_proxy_client_cert_web_xml_files | length > 0
    fail_msg: >-
      Proxy/load-balancer mutual TLS is required. List the associated Tomcat Connector ports in
      tomcat_stig_proxy_connector_ports and each associated application web.xml in
      tomcat_stig_proxy_client_cert_web_xml_files. The role will not apply client-certificate
      requirements to unrelated connectors or applications.
  when:
    - tomcat_stig_behind_proxy | bool
    - tomcat_stig_proxy_mutual_tls_required | bool
    - tomcat_stig_proxy_mutual_tls_risk_acceptance | length == 0
  tags: [V-222971]

- name: "V-222971 | Require client certificates on proxied TLS connectors"
  ansible.builtin.shell: |
    python3 - "{{ tomcat_conf_dir_resolved }}/server.xml" '{{ tomcat_stig_proxy_connector_ports | map("string") | list | to_json }}' <<'PY'
    import json, sys, xml.etree.ElementTree as ET
    path=sys.argv[1]; target_ports=set(json.loads(sys.argv[2]))
    tree=ET.parse(path); root=tree.getroot(); changed=False
    found=set()
    for connector in root.findall(".//Connector"):
        port=connector.get("port","")
        if port not in target_ports:
            continue
        found.add(port)
        sslhosts=connector.findall("SSLHostConfig")
        if sslhosts:
            for shc in sslhosts:
                if shc.get("certificateVerification")!="required":
                    shc.set("certificateVerification","required"); changed=True
        else:
            if connector.get("clientAuth")!="true":
                connector.set("clientAuth","true"); changed=True
    missing=target_ports-found
    if missing:
        raise SystemExit("Configured proxy connector ports not found in server.xml: %s" % ",".join(sorted(missing)))
    if changed:
        tree.write(path,encoding="UTF-8",xml_declaration=True)
    print("CHANGED" if changed else "OK")
    PY
  args:
    executable: /bin/bash
  register: tomcat_stig_proxy_mtls_result
  changed_when: "'CHANGED' in tomcat_stig_proxy_mtls_result.stdout"
  when:
    - tomcat_stig_behind_proxy | bool
    - tomcat_stig_proxy_mutual_tls_required | bool
    - tomcat_stig_proxy_mutual_tls_risk_acceptance | length == 0
  notify: restart tomcat
  tags: [V-222971]

- name: "V-222971 | Configure CLIENT-CERT authentication for proxied applications"
  ansible.builtin.shell: |
    python3 - "{{ item }}" <<'PY'
    import sys, xml.etree.ElementTree as ET
    path=sys.argv[1]
    tree=ET.parse(path); root=tree.getroot()
    ns=root.tag.split("}")[0]+"}" if root.tag.startswith("{") else ""
    q=lambda n: ns+n
    changed=False
    login=root.find(q("login-config"))
    if login is None:
        login=ET.SubElement(root,q("login-config")); changed=True
    auth=login.find(q("auth-method"))
    if auth is None:
        auth=ET.SubElement(login,q("auth-method")); changed=True
    if (auth.text or "").strip()!="CLIENT-CERT":
        auth.text="CLIENT-CERT"; changed=True
    if changed:
        tree.write(path,encoding="UTF-8",xml_declaration=True)
    print("CHANGED" if changed else "OK")
    PY
  args:
    executable: /bin/bash
  loop: "{{ tomcat_stig_proxy_client_cert_web_xml_files }}"
  register: tomcat_stig_client_cert_results
  changed_when: "'CHANGED' in tomcat_stig_client_cert_results.stdout"
  when:
    - tomcat_stig_behind_proxy | bool
    - tomcat_stig_proxy_mutual_tls_required | bool
    - tomcat_stig_proxy_mutual_tls_risk_acceptance | length == 0
  notify: restart tomcat
  tags: [V-222971]

- name: "V-222974 | Detect configured Tomcat clusters"
  ansible.builtin.shell: |
    python3 - "{{ tomcat_conf_dir_resolved }}/server.xml" <<'PY'
    import sys, xml.etree.ElementTree as ET
    root=ET.parse(sys.argv[1]).getroot()
    print(len(root.findall(".//Cluster")))
    PY
  args:
    executable: /bin/bash
  register: tomcat_stig_cluster_count
  changed_when: false
  tags: [V-222974]

- name: "V-222974 | Require trusted-network/encryption evidence when cluster exists"
  ansible.builtin.assert:
    that:
      - tomcat_stig_cluster_trusted_network_documented | bool or tomcat_stig_cluster_encryption_evidence | length > 0
    fail_msg: >-
      server.xml contains a Tomcat Cluster. Document the trusted/private network or provide
      approved cluster-encryption evidence; the role will not invent a network boundary or shared key.
  when: tomcat_stig_cluster_count.stdout | int > 0
  tags: [V-222974]
