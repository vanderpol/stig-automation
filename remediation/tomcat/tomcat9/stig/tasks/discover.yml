---
- name: Gather Tomcat package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Locate Tomcat server.xml candidates
  ansible.builtin.find:
    paths:
      - /etc/tomcat
      - /etc/tomcat9
      - /usr/share/tomcat
      - /var/lib/tomcat
      - /opt
    patterns: server.xml
    recurse: true
    file_type: file
  register: tomcat9_server_xml_candidates

- name: Select discovered Tomcat configuration directory
  ansible.builtin.set_fact:
    tomcat9_stig_conf_dir: >-
      {{ (tomcat9_stig_catalina_base ~ '/conf') if tomcat9_stig_catalina_base | length > 0
         else (tomcat9_server_xml_candidates.files | map(attribute='path') | map('dirname') | list | first | default('')) }}

- name: Fail rather than guess unsupported Tomcat layout
  ansible.builtin.assert:
    that:
      - tomcat9_stig_conf_dir | length > 0
      - tomcat9_stig_conf_dir is match('^/')
    fail_msg: "Unable to determine an authoritative Tomcat configuration directory. Set tomcat9_stig_catalina_base explicitly."

- name: Derive Catalina base from authoritative conf directory
  ansible.builtin.set_fact:
    tomcat9_stig_base: "{{ tomcat9_stig_catalina_base if tomcat9_stig_catalina_base | length > 0 else (tomcat9_stig_conf_dir | dirname) }}"

- name: Determine Catalina home
  ansible.builtin.set_fact:
    tomcat9_stig_home: "{{ tomcat9_stig_catalina_home if tomcat9_stig_catalina_home | length > 0 else tomcat9_stig_base }}"

- name: Record authoritative Tomcat paths
  ansible.builtin.set_fact:
    tomcat9_stig_paths:
      home: "{{ tomcat9_stig_home }}"
      base: "{{ tomcat9_stig_base }}"
      conf: "{{ tomcat9_stig_conf_dir }}"
      logs: "{{ tomcat9_stig_base }}/logs"
      temp: "{{ tomcat9_stig_base }}/temp"
      work: "{{ tomcat9_stig_base }}/work"
      webapps: "{{ tomcat9_stig_base }}/webapps"
      bin: "{{ tomcat9_stig_home }}/bin"
      lib: "{{ tomcat9_stig_home }}/lib"

- name: Show discovered Tomcat paths
  ansible.builtin.debug:
    var: tomcat9_stig_paths
