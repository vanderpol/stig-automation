---
- name: "Manager controls | Detect management applications"
  ansible.builtin.stat:
    path: "{{ tomcat_webapps_dir_resolved }}/{{ item }}"
  loop: [manager, host-manager]
  register: tomcat_stig_management_apps
  tags: [V-222926, V-222962, V-222965, V-222970, V-222976, V-222979, V-222980, V-222981, V-222982]

- name: "Manager controls | Build installed management application list"
  ansible.builtin.set_fact:
    tomcat_stig_installed_management_apps: >-
      {{ tomcat_stig_management_apps.results
         | selectattr('stat.exists', 'equalto', true)
         | map(attribute='item') | list }}
  tags: [V-222926, V-222962, V-222965, V-222970, V-222976, V-222979, V-222980, V-222981, V-222982]

- name: "V-222926 | Require SSP session limit when manager is installed"
  ansible.builtin.assert:
    that:
      - tomcat_stig_manager_max_active_sessions is not none
      - tomcat_stig_manager_max_active_sessions | int > 0
    fail_msg: >-
      Manager is installed. Set tomcat_stig_manager_max_active_sessions to the SSP-approved
      simultaneous management-session limit before remediation.
  when: "'manager' in tomcat_stig_installed_management_apps"
  tags: [V-222926]

- name: "V-222962/V-222965 | Require complete LDAPS JNDIRealm inputs for management applications"
  ansible.builtin.assert:
    that:
      - tomcat_stig_ldap_enabled | bool
      - tomcat_stig_ldap_connection_url.startswith('ldaps://')
      - tomcat_stig_ldap_user_base | length > 0
      - tomcat_stig_ldap_user_search | length > 0
      - tomcat_stig_ldap_role_base | length > 0
      - tomcat_stig_ldap_role_name | length > 0
      - tomcat_stig_ldap_role_search | length > 0
    fail_msg: >-
      Current V3R4 requires LDAP realm authentication for installed management applications and
      LDAPS for JNDIRealm. Supply the site-approved LDAP schema/connection inputs; the role will
      not invent directory structure or credentials.
  when: tomcat_stig_installed_management_apps | length > 0
  tags: [V-222962, V-222965]

- name: "V-222970 | Require management network restriction input"
  ansible.builtin.assert:
    that:
      - tomcat_stig_management_allowed_cidrs | length > 0 or tomcat_stig_management_allowed_cidr_regex | length > 0
    fail_msg: >-
      Manager is installed. Supply either tomcat_stig_management_allowed_cidrs or
      tomcat_stig_management_allowed_cidr_regex using the SSP-approved management networks.
  when: "'manager' in tomcat_stig_installed_management_apps"
  tags: [V-222970]

- name: "V-222980/V-222981/V-222982/V-222962/V-222965 | Configure server.xml LockOutRealm with LDAPS JNDIRealm"
  ansible.builtin.shell: |
    python3 - "{{ tomcat_conf_dir_resolved }}/server.xml" <<'PY'
    import os, sys, xml.etree.ElementTree as ET
    path=sys.argv[1]
    tree=ET.parse(path); root=tree.getroot(); changed=False
    engine=root.find(".//Engine")
    if engine is None:
        raise SystemExit("No Engine element found in server.xml")

    realms=list(engine.findall("Realm"))
    lock=next((r for r in realms if r.get("className")=="org.apache.catalina.realm.LockOutRealm"),None)
    if lock is None:
        lock=ET.Element("Realm", {"className":"org.apache.catalina.realm.LockOutRealm"})
        for r in realms:
            engine.remove(r)
        engine.append(lock)
        changed=True

    # Management authentication must not fall back to Tomcat's local UserDatabaseRealm.
    # The Engine-level realm is inherited by manager/host-manager and is visible to the
    # current V3R4 server.xml checks. Preserve no alternate nested realms here.
    nested=list(lock.findall("Realm"))
    jndi=next((r for r in nested if r.get("className")=="org.apache.catalina.realm.JNDIRealm"),None)
    for r in nested:
        if r is not jndi:
            lock.remove(r); changed=True
    if jndi is None:
        jndi=ET.SubElement(lock,"Realm",{"className":"org.apache.catalina.realm.JNDIRealm"})
        changed=True

    def set_attr(e,k,v):
        global changed
        if v is not None and e.get(k)!=v:
            e.set(k,v); changed=True

    set_attr(lock,"failureCount","5")
    set_attr(lock,"lockOutTime","600")
    attrs={
      "connectionURL":os.environ["TC_STIG_LDAP_URL"],
      "userBase":os.environ["TC_STIG_LDAP_USER_BASE"],
      "userSearch":os.environ["TC_STIG_LDAP_USER_SEARCH"],
      "roleBase":os.environ["TC_STIG_LDAP_ROLE_BASE"],
      "roleName":os.environ["TC_STIG_LDAP_ROLE_NAME"],
      "roleSearch":os.environ["TC_STIG_LDAP_ROLE_SEARCH"],
    }
    if os.environ.get("TC_STIG_LDAP_CONNECTION_NAME"):
        attrs["connectionName"]=os.environ["TC_STIG_LDAP_CONNECTION_NAME"]
    if os.environ.get("TC_STIG_LDAP_CONNECTION_PASSWORD"):
        attrs["connectionPassword"]=os.environ["TC_STIG_LDAP_CONNECTION_PASSWORD"]
    for k,v in attrs.items(): set_attr(jndi,k,v)

    if changed:
        tree.write(path,encoding="UTF-8",xml_declaration=True)
    print("CHANGED" if changed else "OK")
    PY
  args:
    executable: /bin/bash
  environment:
    TC_STIG_LDAP_URL: "{{ tomcat_stig_ldap_connection_url }}"
    TC_STIG_LDAP_USER_BASE: "{{ tomcat_stig_ldap_user_base }}"
    TC_STIG_LDAP_USER_SEARCH: "{{ tomcat_stig_ldap_user_search }}"
    TC_STIG_LDAP_ROLE_BASE: "{{ tomcat_stig_ldap_role_base }}"
    TC_STIG_LDAP_ROLE_NAME: "{{ tomcat_stig_ldap_role_name }}"
    TC_STIG_LDAP_ROLE_SEARCH: "{{ tomcat_stig_ldap_role_search }}"
    TC_STIG_LDAP_CONNECTION_NAME: "{{ tomcat_stig_ldap_connection_name }}"
    TC_STIG_LDAP_CONNECTION_PASSWORD: "{{ tomcat_stig_ldap_connection_password }}"
  register: tomcat_stig_management_realm_result
  changed_when: "'CHANGED' in tomcat_stig_management_realm_result.stdout"
  when: tomcat_stig_installed_management_apps | length > 0
  no_log: "{{ tomcat_stig_ldap_connection_password | length > 0 }}"
  notify: restart tomcat
  tags: [V-222962, V-222965, V-222980, V-222981, V-222982]

- name: "V-223006 | Require ISSO approval evidence for management-role users"
  ansible.builtin.assert:
    that:
      - tomcat_stig_management_user_approval_evidence | length > 0
    fail_msg: >-
      Management applications are installed. Document the Tomcat management-role users/roles
      and ISSO approval in tomcat_stig_management_user_approval_evidence.
  when: tomcat_stig_installed_management_apps | length > 0
  tags: [V-223006]

- name: "V-222926/V-222970 | Configure manager context security"
  ansible.builtin.shell: |
    python3 - "{{ tomcat_webapps_dir_resolved }}" '{{ tomcat_stig_installed_management_apps | to_json }}' "{{ tomcat_stig_manager_max_active_sessions | default(0, true) | int }}" <<'PY'
    import json, os, sys, xml.etree.ElementTree as ET

    webapps, apps_json, max_sessions = sys.argv[1:4]
    allow_regex = os.environ.get("TC_STIG_ALLOW_REGEX", "")
    allow_cidrs = json.loads(os.environ.get("TC_STIG_ALLOW_CIDRS", "[]"))
    apps = json.loads(apps_json)
    any_changed = False

    def set_attr(elem, key, value):
        global any_changed
        if value is not None and elem.get(key) != value:
            elem.set(key, value)
            any_changed = True

    for app in apps:
        path = os.path.join(webapps, app, "META-INF", "context.xml")
        tree = ET.parse(path)
        root = tree.getroot()
        original_xml = ET.tostring(root, encoding='unicode')

        if app == "manager":
            manager = root.find("Manager")
            if manager is None:
                manager = ET.SubElement(root, "Manager")
                any_changed = True
            set_attr(manager, "maxActiveSessions", str(max_sessions))

            valves = [v for v in root.findall("Valve")
                      if v.get("className") in (
                          "org.apache.catalina.valves.RemoteAddrValve",
                          "org.apache.catalina.valves.RemoteCIDRValve")]
            if valves:
                valve = valves[0]
                for extra in valves[1:]:
                    root.remove(extra)
                    any_changed = True
            else:
                valve = ET.SubElement(root, "Valve")
                any_changed = True
            if allow_cidrs:
                set_attr(valve, "className", "org.apache.catalina.valves.RemoteCIDRValve")
                set_attr(valve, "allow", ",".join(allow_cidrs))
            else:
                set_attr(valve, "className", "org.apache.catalina.valves.RemoteAddrValve")
                set_attr(valve, "allow", allow_regex)

        if ET.tostring(root, encoding='unicode') != original_xml:
            tree.write(path, encoding="UTF-8", xml_declaration=True)
            any_changed = True

    print("CHANGED" if any_changed else "OK")
    PY
  args:
    executable: /bin/bash
  environment:
    TC_STIG_ALLOW_REGEX: "{{ tomcat_stig_management_allowed_cidr_regex }}"
    TC_STIG_ALLOW_CIDRS: "{{ tomcat_stig_management_allowed_cidrs | to_json }}"
  register: tomcat_stig_manager_context_result
  changed_when: "'CHANGED' in tomcat_stig_manager_context_result.stdout"
  when: tomcat_stig_installed_management_apps | length > 0
  notify: restart tomcat
  tags: [V-222926, V-222970]

- name: "V-222979 | Configure global 10-minute session timeout when manager is installed"
  ansible.builtin.shell: |
    python3 - "{{ tomcat_conf_dir_resolved }}/web.xml" <<'PY'
    import sys, xml.etree.ElementTree as ET
    path = sys.argv[1]
    tree = ET.parse(path)
    root = tree.getroot()
    ns = root.tag.split('}')[0] + '}' if root.tag.startswith('{') else ''
    q = lambda n: ns + n
    changed = False
    sc = root.find(q('session-config'))
    if sc is None:
        sc = ET.SubElement(root, q('session-config'))
        changed = True
    timeout = sc.find(q('session-timeout'))
    if timeout is None:
        timeout = ET.SubElement(sc, q('session-timeout'))
        changed = True
    if (timeout.text or '').strip() != '10':
        timeout.text = '10'
        changed = True
    if changed:
        tree.write(path, encoding='UTF-8', xml_declaration=True)
    print('CHANGED' if changed else 'OK')
    PY
  args:
    executable: /bin/bash
  register: tomcat_stig_manager_timeout_result
  changed_when: "'CHANGED' in tomcat_stig_manager_timeout_result.stdout"
  when: "'manager' in tomcat_stig_installed_management_apps"
  notify: restart tomcat
  tags: [V-222979]

- name: "V-222976 | Replace manager sample error pages with generic responses"
  ansible.builtin.copy:
    dest: "{{ tomcat_webapps_dir_resolved }}/manager/WEB-INF/jsp/{{ item }}.jsp"
    owner: root
    group: "{{ tomcat_group }}"
    mode: "0640"
    content: |
      <%@ page contentType="text/html; charset=UTF-8" %>
      <!doctype html>
      <html><head><title>Request Error</title></head>
      <body><h1>Request could not be completed</h1>
      <p>Contact the system administrator if access is required.</p></body></html>
  loop: [401, 402, 403, 404]
  when: "'manager' in tomcat_stig_installed_management_apps"
  notify: restart tomcat
  tags: [V-222976]
