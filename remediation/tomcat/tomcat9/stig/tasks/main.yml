---
- name: Validate supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'RedHat'
      - ansible_facts.distribution_major_version in ['8', '9']
    fail_msg: >-
      tomcat9_stig v1.0 supports Red Hat Enterprise Linux 8 and 9 only.
      Ubuntu and RHEL 10 are intentionally outside this stabilization baseline.
  tags: [always]

- name: Discover active Tomcat layout
  ansible.builtin.import_tasks: discovery.yml
  tags: [always, discovery]

- name: Include deterministic remediations
  ansible.builtin.import_tasks: remediation.yml
  when: not tomcat_stig_audit_only | bool
  tags: [stig, remediation]

- name: Include audit and human-decision checks
  ansible.builtin.import_tasks: audit.yml
  tags: [stig, audit]
