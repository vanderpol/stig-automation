---
- name: Gather deployed web applications
  ansible.builtin.find:
    paths: "{{ tomcat_webapps_dir_resolved }}"
    file_type: directory
    recurse: false
  register: _tomcat_webapps
  failed_when: false
  tags: [V-223007, audit]

- name: "V-223007 | HUMAN | Report webapps requiring SSP documentation"
  ansible.builtin.debug:
    msg:
      finding: V-223007
      status: "{{ 'REVIEW' if tomcat_stig_approved_webapps | length == 0 else 'COMPARE' }}"
      deployed: "{{ _tomcat_webapps.files | default([]) | map(attribute='path') | map('basename') | list }}"
      approved_in_ssp: "{{ tomcat_stig_approved_webapps }}"
      human_action: ISSM/ISSO must ensure every hosted application is documented/authorized in the SSP.
  tags: [V-223007, human]

- name: Read configured connector ports
  ansible.builtin.shell: |
    python3 - <<'PY'
    import xml.etree.ElementTree as ET
    r=ET.parse('{{ tomcat_conf_dir_resolved }}/server.xml').getroot()
    print(' '.join(c.get('port','') for c in r.findall('.//Connector')))
    PY
  args: { executable: /bin/bash }
  register: _connector_ports
  changed_when: false
  failed_when: false
  tags: [V-222952, V-223008, audit]

- name: "V-222952/V-223008 | HUMAN | Connector authorization"
  ansible.builtin.debug:
    msg:
      findings: [V-222952, V-223008]
      configured_ports: "{{ _connector_ports.stdout.split() | default([]) }}"
      approved_ports: "{{ tomcat_stig_approved_connector_ports }}"
      status: "{{ 'REVIEW - no approved connector list supplied' if tomcat_stig_approved_connector_ports | length == 0 else 'COMPARE configured ports to approved list' }}"
      human_action: ISSO/SSP must define the authorized connectors and ports; Ansible must not infer mission requirements.
  tags: [V-222952, V-223008, human]

- name: "V-222961 | HUMAN | Privileged application authorization"
  ansible.builtin.debug:
    msg:
      finding: V-222961
      approved_privileged_contexts: "{{ tomcat_stig_approved_privileged_contexts }}"
      human_action: ISSO must explicitly approve any application Context using privileged=true.
  tags: [V-222961, human]

- name: "V-222931 | HUMAN/SECRET | Keystore password validation"
  ansible.builtin.assert:
    that:
      - tomcat_keystore_password | length > 0
      - tomcat_keystore_password not in tomcat_keystore_default_passwords
    fail_msg: "V-222931 REVIEW: provide a non-default keystore password using Ansible Vault; the role will not generate/store an operational secret in source."
    success_msg: "V-222931 configured variable is non-empty and not in the known default list."
  no_log: true
  ignore_errors: true
  tags: [V-222931, human, tls]

- name: "V-222964 | HUMAN/VARIABLE | JMX TLS"
  ansible.builtin.debug:
    msg:
      finding: V-222964
      status: "{{ 'REVIEW TLS settings for remote JMX' if tomcat_stig_remote_jmx_enabled else 'N/A candidate - remote JMX disabled; validate against system design' }}"
      human_action: If remote JMX is authorized, configure and validate TLS, authentication, certificate trust and network restrictions.
  tags: [V-222964, human, jmx]

- name: "V-222993 | HUMAN/EXTERNAL | CAC for management interface"
  ansible.builtin.debug:
    msg:
      finding: V-222993
      status: REVIEW
      human_action: Validate the management interface authentication architecture uses approved certificate-based MFA/CAC; application PKI and identity integration are site-specific.
  tags: [V-222993, human, pki]

- name: "V-222994/V-223001 | HUMAN/PKI | Approved CA and key management"
  ansible.builtin.debug:
    msg:
      findings: [V-222994, V-223001]
      status: REVIEW
      human_action: Validate the certificate chain against DoD/organization-approved trust anchors and document approved key-management technology/processes.
  tags: [V-222994, V-223001, human, pki]

- name: "V-222995 | HUMAN | HA based on RMF categorization"
  ansible.builtin.debug:
    msg:
      finding: V-222995
      ha_required: "{{ tomcat_stig_high_availability_required }}"
      evidence: "{{ tomcat_stig_ha_evidence }}"
      human_action: RMF/system owner determines whether the system requires HA and supplies architecture evidence.
  tags: [V-222995, human, ha]

- name: "V-222996 | VARIABLE/PROCESS | Security patching"
  ansible.builtin.debug:
    msg:
      finding: V-222996
      status: PROCESS
      human_action: Patch/version compliance depends on the organization's approved Tomcat release baseline and vulnerability-management process; do not auto-upgrade across an unapproved application baseline.
  tags: [V-222996, human, patching]

- name: "V-223010 | EXTERNAL | Audit-processing failure notification"
  ansible.builtin.debug:
    msg:
      finding: V-223010
      documented: "{{ tomcat_stig_audit_failure_alerting_documented }}"
      status: "{{ 'DOCUMENTED' if tomcat_stig_audit_failure_alerting_documented else 'REVIEW' }}"
      human_action: Configure RHEL/audit/logging infrastructure to alert SA and ISSO on log-processing/storage failure and retain evidence of notification testing.
  tags: [V-223010, human, external]


# Controls discovered as missing during the V3R4 provenance/current-check reconciliation.
# These audits make the gaps visible without inventing site architecture.

- name: "V-222926 | AUDIT | Manager maxActiveSessions requires SSP value"
  ansible.builtin.debug:
    msg:
      finding: V-222926
      configured_ssp_limit: "{{ tomcat_stig_manager_max_active_sessions }}"
      status: "{{ 'REVIEW - SSP limit not supplied' if tomcat_stig_manager_max_active_sessions is none else 'COMPARE manager META-INF/context.xml maxActiveSessions to SSP limit' }}"
  tags: [V-222926, audit]

- name: "V-222962/V-222965 | AUDIT | LDAP realm and LDAPS requirement"
  ansible.builtin.debug:
    msg:
      findings: [V-222962, V-222965]
      ldap_enabled: "{{ tomcat_stig_ldap_enabled }}"
      connection_url_configured: "{{ tomcat_stig_ldap_connection_url | length > 0 }}"
      ldaps_scheme: "{{ tomcat_stig_ldap_connection_url.startswith('ldaps://') if tomcat_stig_ldap_connection_url | length > 0 else false }}"
      status: "REVIEW - management authentication architecture and effective JNDIRealm must be compared to current V3R4 check."
  tags: [V-222962, V-222965, audit]

- name: "V-222968 | AUDIT | FIPS connector requirement"
  ansible.builtin.debug:
    msg:
      finding: V-222968
      status: REVIEW
      human_action: >-
        Verify current V3R4 FIPSMode/connector requirements and confirm the RHEL Java/OS cryptographic
        modules in use are FIPS validated. Tomcat configuration alone cannot establish this evidence.
  tags: [V-222968, audit]

- name: "V-222970 | AUDIT | Manager network restriction"
  ansible.builtin.debug:
    msg:
      finding: V-222970
      approved_management_regex: "{{ tomcat_stig_management_allowed_cidr_regex }}"
      status: "REVIEW - compare manager META-INF/context.xml RemoteAddrValve/RemoteCIDRValve to approved management networks."
  tags: [V-222970, audit]

- name: "V-222971 | AUDIT | Proxy/load-balancer mutual authentication"
  ansible.builtin.debug:
    msg:
      finding: V-222971
      behind_proxy: "{{ tomcat_stig_behind_proxy }}"
      mutual_tls_required: "{{ tomcat_stig_proxy_mutual_tls_required }}"
      status: "REVIEW - current V3R4 check uses SSLHostConfig certificateVerification/client certificate semantics plus application CLIENT-CERT."
  tags: [V-222971, audit]

- name: "V-222974 | AUDIT | Cluster trusted network"
  ansible.builtin.debug:
    msg:
      finding: V-222974
      cluster_enabled: "{{ tomcat_stig_cluster_enabled }}"
      trusted_network_documented: "{{ tomcat_stig_cluster_trusted_network_documented }}"
      status: "{{ 'REVIEW - trusted cluster network evidence required' if tomcat_stig_cluster_enabled and not tomcat_stig_cluster_trusted_network_documented else 'N/A/REVIEW based on deployed cluster architecture' }}"
  tags: [V-222974, audit]

- name: "V-222976 | AUDIT | Manager default error pages"
  ansible.builtin.debug:
    msg:
      finding: V-222976
      status: REVIEW
      human_action: "If manager is installed, verify its default 401/403/404 JSP error pages are customized and sample account/password guidance is removed."
  tags: [V-222976, audit]

- name: "V-222979 | AUDIT | Manager idle timeout"
  ansible.builtin.debug:
    msg:
      finding: V-222979
      required_minutes: 10
      status: "REVIEW - verify manager application session-timeout is 10 minutes."
  tags: [V-222979, audit]

- name: "V-222980/V-222981/V-222982 | AUDIT | Management LockOutRealm"
  ansible.builtin.debug:
    msg:
      findings: [V-222980, V-222981, V-222982]
      required_failure_count: 5
      required_lockout_seconds: 600
      status: "REVIEW - verify effective management Realm is a LockOutRealm with failureCount=5 and lockOutTime=600."
  tags: [V-222980, V-222981, V-222982, audit]

- name: "V-223006 | EVIDENCE | Management-role user approval"
  ansible.builtin.debug:
    msg:
      finding: V-223006
      evidence: "{{ tomcat_stig_management_user_approval_evidence }}"
      status: "{{ 'DOCUMENTED' if tomcat_stig_management_user_approval_evidence | length > 0 else 'REVIEW' }}"
      human_action: "Document all Tomcat management-role users/roles and ISSO approval. LDAP/local account approval remains an organization evidence requirement."
  tags: [V-223006, audit]

- name: "V-223009 | AUDIT | Connector address completeness"
  ansible.builtin.debug:
    msg:
      finding: V-223009
      approved_connector_addresses: "{{ tomcat_stig_connector_addresses }}"
      status: "REMEDIATION-GUARDED - remediation now requires an SSP-approved address for every active Connector and XML management sets it."
  tags: [V-223009, audit]
