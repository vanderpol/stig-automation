---
rhel9_anti_stig_acknowledge: false
rhel9_anti_stig_lab_only: true
rhel9_anti_stig_preserve_ssh: true
rhel9_anti_stig_preserve_networking: true
rhel9_anti_stig_preserve_journald: true
rhel9_anti_stig_disable_firewalld: true
rhel9_anti_stig_remove_rsyslog: true
rhel9_anti_stig_remove_security_packages:
  - aide
  - audispd-plugins
  - chrony
  - fapolicyd
  - gnutls-utils
  - nss-tools
  - opensc
  - openssl-pkcs11
  - pcsc-lite
  - postfix
  - rng-tools
  - s-nail
  - usbguard
rhel9_anti_stig_ssh_dropin: /etc/ssh/sshd_config.d/99-anti-stig-lab.conf
