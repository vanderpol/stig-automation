---
- name: Configure intentionally weak password-quality policy
  ansible.builtin.copy:
    dest: /etc/security/pwquality.conf.d/99-anti-stig.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      minlen = 6
      dcredit = 0
      ucredit = 0
      lcredit = 0
      ocredit = 0
      difok = 0
      maxclassrepeat = 0
      maxrepeat = 0
      dictcheck = 0
      enforce_for_root = 0
  tags:
    - RHEL-09-611060
    - RHEL-09-611065
    - RHEL-09-611070
    - RHEL-09-611090
    - RHEL-09-611100
    - RHEL-09-611105
    - RHEL-09-611110
    - RHEL-09-611115
    - RHEL-09-611120
    - RHEL-09-611125
    - RHEL-09-611130

- name: Configure intentionally weak faillock policy
  ansible.builtin.copy:
    dest: /etc/security/faillock.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      deny = 0
      fail_interval = 0
      unlock_time = 0
  tags:
    - RHEL-09-411075
    - RHEL-09-411080
    - RHEL-09-411085
    - RHEL-09-411090

- name: Set weak password-aging and umask defaults
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^{{ item.key }}\\s+"
    line: "{{ item.key }} {{ item.value }}"
  loop:
    - { key: PASS_MAX_DAYS, value: '99999' }
    - { key: PASS_MIN_DAYS, value: '0' }
    - { key: PASS_WARN_AGE, value: '0' }
    - { key: UMASK, value: '000' }
  tags:
    - RHEL-09-411010
    - RHEL-09-411025
    - RHEL-09-611075

- name: Create weak but syntactically valid SSH drop-in
  ansible.builtin.copy:
    dest: "{{ rhel9_anti_stig_ssh_dropin }}"
    owner: root
    group: root
    mode: '0600'
    content: |
      # Intentionally noncompliant lab configuration.
      Banner /etc/issue.net
      LogLevel ERROR
      PermitRootLogin yes
      PermitEmptyPasswords yes
      PubkeyAuthentication yes
      UsePAM yes
      X11Forwarding yes
      X11UseLocalhost no
      ClientAliveInterval 0
      ClientAliveCountMax 3
      MaxAuthTries 10
      IgnoreRhosts no
      IgnoreUserKnownHosts no
      HostbasedAuthentication yes
      PermitUserEnvironment yes
      StrictModes no
      PrintLastLog no
      KerberosAuthentication yes
      GSSAPIAuthentication yes
      AllowAgentForwarding yes
      AllowTcpForwarding yes
  register: anti_stig_ssh_dropin
  tags:
    - RHEL-09-255025
    - RHEL-09-255030
    - RHEL-09-255040
    - RHEL-09-255045
    - RHEL-09-255080
    - RHEL-09-255085
    - RHEL-09-255095
    - RHEL-09-255100
    - RHEL-09-255135
    - RHEL-09-255140
    - RHEL-09-255145
    - RHEL-09-255150
    - RHEL-09-255155
    - RHEL-09-255160
    - RHEL-09-255165
    - RHEL-09-255175

- name: Validate sshd before allowing a restart
  when:
    - rhel9_anti_stig_preserve_ssh | bool
    - anti_stig_ssh_dropin.changed
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Restart sshd only after successful syntax validation
  when:
    - rhel9_anti_stig_preserve_ssh | bool
    - anti_stig_ssh_dropin.changed
  ansible.builtin.systemd:
    name: sshd
    state: restarted
