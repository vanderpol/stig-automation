---
- name: Configure intentionally weak password-quality policy
  ansible.builtin.copy:
    dest: /etc/security/pwquality.conf.d/99-anti-stig.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      minlen = 6
      dcredit = 0
      ucredit = 0
      lcredit = 0
      ocredit = 0
      maxrepeat = 0
      dictcheck = 0
  tags:
    - RHEL-09-611010
    - RHEL-09-611030
    - RHEL-09-611035
    - RHEL-09-611040
    - RHEL-09-611045
    - RHEL-09-611050

- name: Configure intentionally weak faillock policy
  ansible.builtin.copy:
    dest: /etc/security/faillock.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      deny = 0
      fail_interval = 0
      unlock_time = 0
  tags:
    - RHEL-09-411080
    - RHEL-09-411085
    - RHEL-09-411090

- name: Set weak password-aging defaults
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^{{ item.key }}\\s+"
    line: "{{ item.key }} {{ item.value }}"
  loop:
    - { key: PASS_MAX_DAYS, value: '99999' }
    - { key: PASS_MIN_DAYS, value: '0' }
    - { key: PASS_WARN_AGE, value: '0' }
    - { key: UMASK, value: '000' }
  tags:
    - RHEL-09-411010
    - RHEL-09-411015
    - RHEL-09-411020

- name: Create weak but syntactically valid SSH drop-in
  ansible.builtin.copy:
    dest: "{{ rhel9_anti_stig_ssh_dropin }}"
    owner: root
    group: root
    mode: '0600'
    content: |
      # Intentionally noncompliant lab configuration.
      PermitRootLogin yes
      PermitEmptyPasswords yes
      X11Forwarding yes
      X11UseLocalhost no
      ClientAliveInterval 0
      ClientAliveCountMax 3
      MaxAuthTries 10
      IgnoreRhosts no
      HostbasedAuthentication yes
      PermitUserEnvironment yes
      AllowAgentForwarding yes
      AllowTcpForwarding yes
      GSSAPIAuthentication yes
  register: anti_stig_ssh_dropin
  tags:
    - RHEL-09-255010
    - RHEL-09-255015
    - RHEL-09-255020
    - RHEL-09-255025
    - RHEL-09-255035
    - RHEL-09-255040
    - RHEL-09-255045
    - RHEL-09-255050
    - RHEL-09-255064
    - RHEL-09-255065
    - RHEL-09-255070
    - RHEL-09-255075
    - RHEL-09-255080
    - RHEL-09-255085
    - RHEL-09-255090
    - RHEL-09-255095
    - RHEL-09-255100
    - RHEL-09-255105
    - RHEL-09-255110
    - RHEL-09-255115
    - RHEL-09-255120
    - RHEL-09-255125
    - RHEL-09-255135
    - RHEL-09-255140
    - RHEL-09-255145
    - RHEL-09-255150
    - RHEL-09-255155
    - RHEL-09-255160
    - RHEL-09-255165
    - RHEL-09-255175

- name: Validate sshd before allowing a restart
  when:
    - rhel9_anti_stig_preserve_ssh | bool
    - anti_stig_ssh_dropin.changed
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Restart sshd only after successful syntax validation
  when:
    - rhel9_anti_stig_preserve_ssh | bool
    - anti_stig_ssh_dropin.changed
  ansible.builtin.systemd:
    name: sshd
    state: restarted
