---
- name: Set a non-FIPS system crypto policy
  ansible.builtin.command: update-crypto-policies --set DEFAULT
  register: anti_stig_crypto
  changed_when: anti_stig_crypto.rc == 0
  failed_when: anti_stig_crypto.rc != 0
  tags:
    - RHEL-09-215105
    - RHEL-09-671010
    - RHEL-09-672020

- name: Put SELinux into permissive mode for the running lab
  ansible.posix.selinux:
    policy: targeted
    state: permissive
  tags:
    - RHEL-09-431010
    - RHEL-09-431015

- name: Configure deliberately noncompliant sysctl values
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-anti-stig.conf
    reload: true
  loop:
    - { name: kernel.randomize_va_space, value: '0' }
    - { name: kernel.kptr_restrict, value: '0' }
    - { name: kernel.dmesg_restrict, value: '0' }
    - { name: kernel.perf_event_paranoid, value: '0' }
    - { name: kernel.kexec_load_disabled, value: '0' }
    - { name: kernel.yama.ptrace_scope, value: '0' }
    - { name: net.ipv4.conf.all.accept_redirects, value: '1' }
    - { name: net.ipv4.conf.default.accept_redirects, value: '1' }
    - { name: net.ipv4.conf.all.send_redirects, value: '1' }
    - { name: net.ipv4.conf.default.send_redirects, value: '1' }
    - { name: net.ipv4.conf.all.accept_source_route, value: '1' }
    - { name: net.ipv4.conf.default.accept_source_route, value: '1' }
    - { name: net.ipv4.tcp_syncookies, value: '0' }
  tags:
    - RHEL-09-213010
    - RHEL-09-213015
    - RHEL-09-213020
    - RHEL-09-213025
    - RHEL-09-213070
    - RHEL-09-253010
    - RHEL-09-253015
    - RHEL-09-253020
    - RHEL-09-253025
    - RHEL-09-253030
    - RHEL-09-253035

- name: Install weak shell defaults without changing network or SSH reachability
  ansible.builtin.copy:
    dest: /etc/profile.d/99-anti-stig.sh
    owner: root
    group: root
    mode: '0644'
    content: |
      # Intentionally insecure test fixture
      umask 000
      TMOUT=0
  tags:
    - RHEL-09-411020
    - RHEL-09-411030
