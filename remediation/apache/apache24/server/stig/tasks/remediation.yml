---
- name: "V-214255/V-214256/V-214257 | Install managed server hardening"
  ansible.builtin.copy:
    dest: "{{ apache24.managed_conf }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by stig-automation - Apache Server 2.4 UNIX Server STIG V3R3
      Timeout {{ apache24_stig_timeout }}
      ServerTokens {{ apache24_stig_server_tokens }}
      ServerSignature {{ apache24_stig_server_signature }}
      TraceEnable {{ apache24_stig_trace_enable }}
      LogLevel {{ apache24_stig_log_level }}
      {% for code, message in apache24_stig_error_documents.items() %}
      ErrorDocument {{ code }} "{{ message }}"
      {% endfor %}
  notify: restart apache
  tags: [V-214255, V-214256, V-214257]

- name: Enable managed server configuration on Ubuntu
  ansible.builtin.file:
    src: "{{ apache24.managed_conf }}"
    dest: /etc/apache2/conf-enabled/00-stig-server.conf
    state: link
  when: ansible_facts.distribution == 'Ubuntu'
  notify: restart apache

- name: "V-214235/V-214236 | Protect Apache log directory"
  ansible.builtin.file:
    path: "{{ apache24.log_dir }}"
    owner: root
    group: "{{ apache24.group }}"
    mode: "{{ apache24_stig_log_dir_mode }}"
    state: directory
  tags: [V-214235, V-214236]

- name: "V-214235/V-214236 | Find Apache log files"
  ansible.builtin.find:
    paths: "{{ apache24.log_dir }}"
    file_type: file
  register: apache24_log_files
  tags: [V-214235, V-214236]

- name: "V-214235/V-214236 | Protect Apache log files"
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: "{{ apache24.group }}"
    mode: "{{ apache24_stig_log_file_mode }}"
  loop: "{{ apache24_log_files.files | default([]) }}"
  tags: [V-214235, V-214236]

- name: "V-214271 | Disable interactive service-account login"
  ansible.builtin.user:
    name: "{{ apache24.user }}"
    shell: /usr/sbin/nologin
    password_lock: true
  tags: [V-214271]

- name: "V-214274 | Find password files"
  ansible.builtin.find:
    paths: "{{ apache24.config_root }}"
    patterns: ["*.htpasswd", "htpasswd", ".htpasswd"]
    recurse: true
    file_type: file
  register: apache24_htpasswd_files
  tags: [V-214274]

- name: "V-214274 | Protect password files"
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: "{{ apache24.group }}"
    mode: "{{ apache24_stig_htpasswd_mode }}"
  loop: "{{ apache24_htpasswd_files.files | default([]) }}"
  tags: [V-214274]

- name: "V-214246 | Require explicit approved Listen endpoints"
  ansible.builtin.assert:
    that:
      - apache24_stig_listen | length > 0
      - "'*' not in (apache24_stig_listen | join(' '))"
      - "'0.0.0.0' not in (apache24_stig_listen | join(' '))"
      - "'[::]' not in (apache24_stig_listen | join(' '))"
    fail_msg: Set apache24_stig_listen to site-approved explicit IP:port endpoints.
  tags: [V-214246]

- name: "V-214246/V-214269 | Find Apache configuration files"
  ansible.builtin.find:
    paths: "{{ apache24.config_root }}"
    patterns: "*.conf"
    recurse: true
    file_type: file
  register: apache24_all_conf_files
  tags: [V-214246, V-214269]

- name: "V-214246 | Validate approved Listen endpoint syntax"
  ansible.builtin.assert:
    that:
      - item is match('^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}:[0-9]{1,5}$') or item is match('^\\[[0-9A-Fa-f:]+\\]:[0-9]{1,5}$')
      - (item | regex_replace('^.*:', '') | int) >= 1
      - (item | regex_replace('^.*:', '') | int) <= 65535
    fail_msg: "V-214246 requires an explicit IPv4:port or [IPv6]:port endpoint; invalid value: {{ item }}"
  loop: "{{ apache24_stig_listen }}"
  tags: [V-214246]

- name: "V-214246 | Disable unmanaged Listen directives"
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^(\\s*Listen\\s+.*)$'
    replace: '# STIG replaced unmanaged Listen: \\1'
  loop: "{{ apache24_all_conf_files.files | default([]) }}"
  when: item.path != apache24.managed_conf
  notify: restart apache
  tags: [V-214246]

- name: "V-214246 | Configure approved Listen endpoints"
  ansible.builtin.blockinfile:
    path: "{{ apache24.managed_conf }}"
    marker: "# {mark} STIG LISTEN ENDPOINTS"
    block: |
      {% for endpoint in apache24_stig_listen %}
      Listen {{ endpoint }}
      {% endfor %}
  notify: restart apache
  tags: [V-214246]

- name: "V-214242 | Remove packaged Apache documentation"
  ansible.builtin.package:
    name: "{{ 'httpd-manual' if ansible_facts.distribution == 'RedHat' else 'apache2-doc' }}"
    state: absent
  when: apache24_stig_remove_documentation_packages | bool
  tags: [V-214242]

- name: "V-214245 | Disable WebDAV modules on Ubuntu"
  ansible.builtin.command: a2dismod -f dav dav_fs dav_lock
  register: apache24_dav_disable
  changed_when: "'disabled' in apache24_dav_disable.stdout"
  failed_when: false
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - apache24_stig_disable_webdav | bool
  notify: restart apache
  tags: [V-214245]

- name: "V-214245 | Find RHEL module configuration"
  ansible.builtin.find:
    paths: "{{ apache24.config_root }}"
    patterns: "*.conf"
    recurse: true
    file_type: file
  register: apache24_rhel_conf_files
  when:
    - ansible_facts.distribution == 'RedHat'
    - apache24_stig_disable_webdav | bool
  tags: [V-214245]

- name: "V-214245 | Disable WebDAV LoadModule directives on RHEL"
  ansible.builtin.replace:
    path: "{{ item.0.path }}"
    regexp: '^(\s*LoadModule\s+{{ item.1 }}_module\s+.*)$'
    replace: '# STIG disabled: \1'
  loop: "{{ (apache24_rhel_conf_files.files | default([])) | product(['dav','dav_fs','dav_lock']) | list }}"
  when:
    - ansible_facts.distribution == 'RedHat'
    - apache24_stig_disable_webdav | bool
  notify: restart apache
  tags: [V-214245]

- name: "V-214230 | Ensure TLS module package is installed on RHEL"
  ansible.builtin.package:
    name: mod_ssl
    state: present
  when: ansible_facts.distribution == 'RedHat'
  tags: [V-214230]

- name: "V-214230 | Enable TLS module on Ubuntu"
  ansible.builtin.command: a2enmod ssl
  register: apache24_ssl_enable
  changed_when: "'Enabling module ssl' in apache24_ssl_enable.stdout"
  when: ansible_facts.distribution == 'Ubuntu'
  notify: restart apache
  tags: [V-214230]

- name: "V-214230/V-214231/V-214232/V-214241/V-214269 | Install core directives"
  ansible.builtin.blockinfile:
    path: "{{ apache24.managed_conf }}"
    marker: "# {mark} STIG CORE DIRECTIVES"
    block: |
      ProxyRequests Off
      SSLProtocol {{ apache24_stig_ssl_protocol }}
      SSLCipherSuite {{ apache24_stig_ssl_cipher_suite }}
      LogFormat "{{ apache24_stig_log_format }}" {{ apache24_stig_log_format_name }}
      CustomLog "{{ apache24_stig_custom_log if apache24_stig_custom_log | length > 0 else apache24.log_dir + '/access_log' }}" {{ apache24_stig_log_format_name }}
  notify: restart apache
  tags: [V-214230, V-214231, V-214232, V-214241, V-214269]

- name: "V-214269 | Ensure enabled cipher directives exclude export ciphers"
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^(\\s*SSLCipherSuite\\s+)(?!.*!(?:EXPORT|EXP)(?:[:\\s]|$))(.+)$'
    replace: '\\1\\2:!EXPORT'
  loop: "{{ apache24_all_conf_files.files | default([]) }}"
  notify: restart apache
  tags: [V-214269]

- name: "V-214269 | Re-scan enabled cipher directives after remediation"
  ansible.builtin.shell: >-
    grep -RhiE '^[[:space:]]*SSLCipherSuite[[:space:]]+' {{ apache24.config_root | quote }} --include='*.conf' || true
  args:
    executable: /bin/bash
  register: apache24_enabled_cipher_directives
  changed_when: false
  tags: [V-214269]

- name: "V-214269 | Verify every enabled cipher directive excludes export ciphers"
  ansible.builtin.assert:
    that:
      - apache24_enabled_cipher_directives.stdout_lines | length > 0
      - >-
        (apache24_enabled_cipher_directives.stdout_lines
         | reject('search', '!(EXPORT|EXP)(:|\\s|$)')
         | list | length) == 0
    fail_msg: >-
      V-214269 finding: every enabled SSLCipherSuite must contain !EXPORT or !EXP,
      and at least one enabled SSLCipherSuite must exist.
  tags: [V-214269]

- name: "V-214243 | Deny configured prohibited resource extensions"
  ansible.builtin.blockinfile:
    path: "{{ apache24.managed_conf }}"
    marker: "# {mark} STIG RESOURCE MAPPINGS"
    block: |
      <FilesMatch "(?i)({{ apache24_stig_blocked_extensions | map('regex_escape') | join('|') }})$">
          Require all denied
      </FilesMatch>
  when: apache24_stig_blocked_extensions | length > 0
  notify: restart apache
  tags: [V-214243]

- name: "V-214244 | Disable CGI modules on Ubuntu when site declares CGI unused"
  ansible.builtin.command: a2dismod -f cgi cgid
  register: apache24_cgi_disable
  changed_when: "'disabled' in apache24_cgi_disable.stdout"
  failed_when: false
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - apache24_stig_disable_cgi | bool
    - not apache24_stig_cgi_approved | bool
  notify: restart apache
  tags: [V-214244]

- name: "V-214267 | Protect Apache control utility"
  ansible.builtin.file:
    path: "{{ apache24.apachectl }}"
    owner: root
    group: root
    mode: "{{ apache24_stig_control_binary_mode }}"
  tags: [V-214267]

- name: "V-214267 | Protect Apache PID directory"
  ansible.builtin.file:
    path: "{{ apache24_pid_file_resolved | dirname }}"
    owner: root
    group: root
    mode: "{{ apache24_stig_pid_dir_mode }}"
    state: directory
