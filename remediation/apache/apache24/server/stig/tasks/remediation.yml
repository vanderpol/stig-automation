  register: apache24_unique_id_module
  when: ansible_facts.distribution == 'RedHat'
  tags: [V-214253]

- name: "V-214253 | Validate unique_id module availability on RHEL"
  ansible.builtin.assert:
    that: apache24_unique_id_module.stat.exists | default(false)
    fail_msg: mod_unique_id.so is required by V-214253 but was not found.
  when: ansible_facts.distribution == 'RedHat'
  tags: [V-214253]

- name: "V-214253 | Load unique_id module on RHEL"
  ansible.builtin.lineinfile:
    path: "{{ apache24.modules_conf }}"
    regexp: '^\s*#?\s*LoadModule\s+unique_id_module\s+'
    line: 'LoadModule unique_id_module modules/mod_unique_id.so'
    insertafter: EOF
  when: ansible_facts.distribution == 'RedHat'
  notify: restart apache
  tags: [V-214253]

