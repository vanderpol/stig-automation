---
- name: "V-214255/V-214256/V-214257 | Install managed server hardening"
  ansible.builtin.copy:
    dest: "{{ apache24.managed_conf }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by stig-automation - Apache Server 2.4 UNIX Server STIG V3R3
      Timeout {{ apache24_stig_timeout }}
      ServerTokens {{ apache24_stig_server_tokens }}
      ServerSignature {{ apache24_stig_server_signature }}
      TraceEnable {{ apache24_stig_trace_enable }}
      LogLevel {{ apache24_stig_log_level }}
  notify: restart apache
  tags: [V-214246, V-214255, V-214256, V-214257]

- name: Enable managed configuration on Ubuntu
  ansible.builtin.file:
    src: "{{ apache24.managed_conf }}"
    dest: "/etc/apache2/conf-enabled/00-stig-server.conf"
    state: link
  when: ansible_facts.distribution == 'Ubuntu'
  notify: restart apache

- name: "V-214235/V-214236 | Protect Apache log directory"
  ansible.builtin.file:
    path: "{{ apache24.log_dir }}"
    owner: root
    group: "{{ apache24.group }}"
    mode: "{{ apache24_stig_log_dir_mode }}"
    state: directory
  tags: [V-214235, V-214236]

- name: "V-214235/V-214236 | Find Apache log files"
  ansible.builtin.find:
    paths: "{{ apache24.log_dir }}"
    file_type: file
  register: apache24_log_files
  tags: [V-214235, V-214236]

- name: "V-214235/V-214236 | Protect Apache log files"
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: "{{ apache24.group }}"
    mode: "{{ apache24_stig_log_file_mode }}"
  loop: "{{ apache24_log_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  tags: [V-214235, V-214236]

- name: "V-214271 | Set Apache service account to nologin"
  ansible.builtin.user:
    name: "{{ apache24.user }}"
    shell: /usr/sbin/nologin
    password_lock: true
  tags: [V-214271]

- name: "V-214274 | Find htpasswd files"
  ansible.builtin.find:
    paths: "{{ apache24.config_root }}"
    patterns: ["*.htpasswd", "htpasswd", ".htpasswd"]
    file_type: file
    recurse: true
  register: apache24_htpasswd_files
  tags: [V-214274]

- name: "V-214274 | Protect htpasswd files"
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: "{{ apache24.group }}"
    mode: "{{ apache24_stig_htpasswd_mode }}"
  loop: "{{ apache24_htpasswd_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  tags: [V-214274]

- name: "V-214246 | Require site-approved listen endpoints"
  ansible.builtin.assert:
    that:
      - apache24_stig_listen | length > 0
      - apache24_stig_listen | select('match', '^[^:[:space:]]+:[0-9]+
  ansible.builtin.package:
    name: "{{ 'httpd-manual' if ansible_facts.distribution == 'RedHat' else 'apache2-doc' }}"
    state: absent
  when: apache24_stig_remove_documentation_packages | bool
  tags: [V-214242]

- name: "V-214245 | Disable WebDAV modules on Ubuntu"
  ansible.builtin.command: a2dismod -f dav dav_fs dav_lock
  register: apache24_dav_disable
  changed_when: "'Module dav disabled' in apache24_dav_disable.stdout or 'Module dav_fs disabled' in apache24_dav_disable.stdout or 'Module dav_lock disabled' in apache24_dav_disable.stdout"
  failed_when: false
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - apache24_stig_disable_webdav | bool
  notify: restart apache
  tags: [V-214245]

- name: "V-214245 | Find RHEL module configuration"
  ansible.builtin.find:
    paths: /etc/httpd
    patterns: "*.conf"
    recurse: true
    file_type: file
  register: apache24_rhel_conf_files
  when:
    - ansible_facts.distribution == 'RedHat'
    - apache24_stig_disable_webdav | bool
  tags: [V-214245]

- name: "V-214245 | Disable WebDAV LoadModule directives on RHEL"
  ansible.builtin.replace:
    path: "{{ item.0.path }}"
    regexp: '^(\\s*LoadModule\\s+{{ item.1 }}_module\\s+.*)
  ansible.builtin.command: "{{ apache24.apachectl }} configtest"
  changed_when: false

    replace: '# STIG disabled: \\1'
  loop: "{{ apache24_rhel_conf_files.files | default([]) | product(['dav','dav_fs','dav_lock']) | list }}"
  loop_control:
    label: "{{ item.0.path }} {{ item.1 }}"
  when:
    - ansible_facts.distribution == 'RedHat'
    - apache24_stig_disable_webdav | bool
  notify: restart apache
  tags: [V-214245]

- name: "V-214230 | Ensure TLS module package is installed on RHEL"
  ansible.builtin.package:
    name: mod_ssl
    state: present
  when: ansible_facts.distribution == 'RedHat'
  tags: [V-214230]

- name: "V-214230 | Enable TLS module on Ubuntu"
  ansible.builtin.command: a2enmod ssl
  register: apache24_ssl_enable
  changed_when: "'Enabling module ssl' in apache24_ssl_enable.stdout"
  when: ansible_facts.distribution == 'Ubuntu'
  notify: restart apache
  tags: [V-214230]

- name: "V-214230/V-214231/V-214232/V-214241/V-214269 | Install core STIG directives"
  ansible.builtin.blockinfile:
    path: "{{ apache24.managed_conf }}"
    marker: "# {mark} STIG CORE DIRECTIVES"
    block: |
      ProxyRequests Off
      SSLProtocol {{ apache24_stig_ssl_protocol }}
      SSLCipherSuite {{ apache24_stig_ssl_cipher_suite }}
      LogFormat "{{ apache24_stig_log_format }}" {{ apache24_stig_log_format_name }}
      {% if apache24_stig_custom_log | length > 0 %}
      CustomLog "{{ apache24_stig_custom_log }}" {{ apache24_stig_log_format_name }}
      {% else %}
      CustomLog "{{ apache24.log_dir }}/access_log" {{ apache24_stig_log_format_name }}
      {% endif %}
  notify: restart apache
  tags: [V-214230, V-214231, V-214232, V-214241, V-214269]

- name: "V-214243 | Install prohibited resource mappings"
  ansible.builtin.blockinfile:
    path: "{{ apache24.managed_conf }}"
    marker: "# {mark} STIG RESOURCE MAPPINGS"
    block: |
      <FilesMatch "{{ apache24_stig_blocked_extensions | map('regex_escape') | join('|') }}">
          Require all denied
      </FilesMatch>
  when: apache24_stig_blocked_extensions | length > 0
  notify: restart apache
  tags: [V-214243]

- name: "V-214244 | Disable CGI modules on Ubuntu when CGI is not approved"
  ansible.builtin.command: a2dismod -f cgi cgid
  register: apache24_cgi_disable
  changed_when: "'Module cgi disabled' in apache24_cgi_disable.stdout or 'Module cgid disabled' in apache24_cgi_disable.stdout"
  failed_when: false
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - apache24_stig_disable_cgi | bool
    - not apache24_stig_cgi_approved | bool
  notify: restart apache
  tags: [V-214244]

- name: "V-214267 | Protect Apache control utility"
  ansible.builtin.file:
    path: "{{ apache24.apachectl }}"
    owner: root
    group: root
    mode: "{{ apache24_stig_control_binary_mode }}"
  tags: [V-214267]

- name: "V-214267 | Protect Apache PID directory"
  ansible.builtin.file:
    path: "{{ apache24_pid_file_resolved | dirname }}"
    owner: root
    group: root
    mode: "{{ apache24_stig_pid_dir_mode }}"
    state: directory
  tags: [V-214267]

- name: "V-214268 | Enable headers module on Ubuntu for HttpOnly cookie enforcement"
  ansible.builtin.command: a2enmod headers
  register: apache24_headers_enable
  changed_when: "'Enabling module headers' in apache24_headers_enable.stdout"
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - apache24_stig_cookie_httponly | bool
  notify: restart apache
  tags: [V-214268]

- name: "V-214268 | Add HttpOnly to response cookies"
  ansible.builtin.blockinfile:
    path: "{{ apache24.managed_conf }}"
    marker: "# {mark} STIG COOKIE PROTECTION"
    block: |
      Header always edit Set-Cookie ^((?:(?!;[[:space:]]*HttpOnly).)*)$ "$1; HttpOnly"
  when: apache24_stig_cookie_httponly | bool
  notify: restart apache
  tags: [V-214268]

- name: "V-214253 | Enable unique_id module on Ubuntu"
  ansible.builtin.command: a2enmod unique_id
  register: apache24_unique_id_enable
  changed_when: "'Enabling module unique_id' in apache24_unique_id_enable.stdout"
  when: ansible_facts.distribution == 'Ubuntu'
  notify: restart apache
  tags: [V-214253]

- name: "V-214253 | Find unique_id module on RHEL"
  ansible.builtin.find:
    paths: /usr/lib64/httpd/modules
    patterns: mod_unique_id.so
    file_type: file
  register: apache24_unique_id_module
  when: ansible_facts.distribution == 'RedHat'
  tags: [V-214253]

- name: "V-214253 | Require unique_id module availability on RHEL"
  ansible.builtin.assert:
    that: apache24_unique_id_module.matched | default(0) > 0
    fail_msg: "mod_unique_id.so is required by V-214253 but was not found."
  when: ansible_facts.distribution == 'RedHat'
  tags: [V-214253]

- name: "V-214253 | Load unique_id module on RHEL"
  ansible.builtin.lineinfile:
    path: /etc/httpd/conf.modules.d/00-base.conf
    regexp: '^\\s*#?\\s*LoadModule\\s+unique_id_module\\s+'
    line: 'LoadModule unique_id_module modules/mod_unique_id.so'
    insertafter: EOF
  when: ansible_facts.distribution == 'RedHat'
  notify: restart apache
  tags: [V-214253]

- name: "V-214259 | Install nonsecure-zone deny list"
  ansible.builtin.blockinfile:
    path: "{{ apache24.managed_conf }}"
    marker: "# {mark} STIG NONSECURE ZONES"
    block: |
      <Location "/">
          <RequireAll>
              Require all granted
      {% for network in apache24_stig_blocked_networks %}
              Require not ip {{ network }}
      {% endfor %}
          </RequireAll>
      </Location>
  when: apache24_stig_blocked_networks | length > 0
  notify: restart apache
  tags: [V-214259]

- name: Validate Apache configuration after remediation
  ansible.builtin.command: "{{ apache24.apachectl }} configtest"
  changed_when: false
) | list | length == apache24_stig_listen | length
