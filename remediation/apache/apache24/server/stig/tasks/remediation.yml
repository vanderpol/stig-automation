  when: item.path != apache24.managed_conf
  notify: restart apache
  tags: [V-214246]

- name: "V-214246 | Configure approved Listen endpoints"
  ansible.builtin.blockinfile:
    path: "{{ apache24.managed_conf }}"
    marker: "# {mark} STIG LISTEN ENDPOINTS"
    block: |
      {% for endpoint in apache24_stig_listen %}
      Listen {{ endpoint }}
      {% endfor %}
  notify: restart apache
  tags: [V-214246]

