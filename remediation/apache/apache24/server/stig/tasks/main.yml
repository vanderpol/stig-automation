---
- name: Load Apache platform map
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../common/vars/main.yml"

- name: Apply isolated-lab defaults
  ansible.builtin.set_fact:
    apache24_stig_listen: "{{ apache24_stig_listen if apache24_stig_listen | length > 0 else [ansible_default_ipv4.address ~ ':' ~ (apache24_stig_lab_listen_port | string)] }}"
  when: apache24_stig_lab_mode | bool
  tags: [always, lab]

- name: Validate supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['RedHat', 'Ubuntu']
      - (ansible_facts.distribution == 'RedHat' and ansible_facts.distribution_major_version in ['8', '9', '10']) or (ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version in ['22.04', '24.04', '26.04'])
    fail_msg: Apache 2.4 UNIX Server STIG role supports RHEL 8/9/10 and Ubuntu 22.04/24.04/26.04.

- name: Resolve platform settings
  ansible.builtin.set_fact:
    apache24: "{{ apache24_platforms[ansible_facts.distribution] }}"

- name: Discover Apache installation
  ansible.builtin.import_tasks: discovery.yml

- name: Summarize Server STIG readiness
  ansible.builtin.import_tasks: preflight.yml

- name: Apply deterministic remediation
  ansible.builtin.import_tasks: remediation.yml
  when: not apache24_stig_audit_only | bool

- name: Audit administrative access boundaries
  ansible.builtin.import_tasks: admin_audit.yml

- name: Audit application session requirements
  ansible.builtin.import_tasks: session_audit.yml

- name: Evaluate evidence-dependent controls
  ansible.builtin.import_tasks: audit.yml
