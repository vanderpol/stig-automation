---
- name: "V-214286 | Report RFC 5280 validation evidence"
  ansible.builtin.debug:
    msg:
      pki_enabled: "{{ apache24_site_pki_enabled }}"
      evidence: "{{ apache24_site_rfc5280_validation_evidence }}"
      requirement: "When PKI is used, the site must perform RFC 5280-compliant certification-path validation."
  tags: [V-214286, audit]

- name: "V-214300 | Require user-supplied approved CA material when client PKI is enabled"
  ansible.builtin.assert:
    that:
      - apache24_site_client_ca_file | length > 0
      - apache24_site_client_ca_approval_reference | length > 0
    fail_msg: >-
      Client PKI is enabled. Supply the organization-maintained DoD/DoD-approved CA bundle path
      and an approval/evidence reference. The role does not download or decide trusted CAs.
  when: apache24_site_pki_enabled | bool
  tags: [V-214300, audit]

- name: "V-214287 | Inspect configured private key"
  ansible.builtin.stat:
    path: "{{ apache24_site_private_key_file }}"
  register: apache24_site_private_key_stat
  when: apache24_site_private_key_file | length > 0
  tags: [V-214287, audit]

- name: "V-214287 | Report private-key ownership and mode"
  ansible.builtin.debug:
    msg:
      path: "{{ apache24_site_private_key_file }}"
      owner: "{{ apache24_site_private_key_stat.stat.pw_name | default('unknown') }}"
      group: "{{ apache24_site_private_key_stat.stat.gr_name | default('unknown') }}"
      mode: "{{ apache24_site_private_key_stat.stat.mode | default('unknown') }}"
      approved_accounts: "{{ apache24_site_private_key_approved_accounts }}"
  when: apache24_site_private_key_file | length > 0
  tags: [V-214287, audit]

- name: Report site-owned evidence requirements
  ansible.builtin.debug:
    msg:
      - "The end user owns PKI trust material and proof that accepted client CAs are DoD/DoD-approved."
      - "The end user owns RFC 5280/revocation validation configuration and evidence when PKI applies."
      - "The end user owns application architecture, authentication/user-management, DR, PPSM, and operational-tuning decisions/evidence."
      - "Supplying an evidence variable records a reference; it does not create or approve the evidence."
  tags: [audit, evidence]

- name: "V-214290 | Determine document-root mount"
  ansible.builtin.command:
    argv:
      - findmnt
      - -n
      - -T
      - "{{ apache24_site_document_root }}"
      - -o
      - TARGET
  register: apache24_site_document_mount
  changed_when: false
  when: apache24_site_document_root | length > 0
  tags: [V-214290, audit]

- name: "V-214290 | Determine Apache system-file mount"
  ansible.builtin.command:
    argv:
      - findmnt
      - -n
      - -T
      - "{{ apache24.config_root }}"
      - -o
      - TARGET
  register: apache24_site_system_mount
  changed_when: false
  when: apache24_site_document_root | length > 0
  tags: [V-214290, audit]

- name: "V-214290 | Determine operating-system root mount"
  ansible.builtin.command:
    argv: [findmnt, -n, -T, /, -o, TARGET]
  register: apache24_site_os_mount
  changed_when: false
  when: apache24_site_document_root | length > 0
  tags: [V-214290, audit]

- name: "V-214290 | Verify document root is on a separate filesystem"
  ansible.builtin.assert:
    that:
      - apache24_site_document_mount.stdout | trim != apache24_site_system_mount.stdout | trim
      - apache24_site_document_mount.stdout | trim != apache24_site_os_mount.stdout | trim
    fail_msg: >-
      V-214290 finding: document root {{ apache24_site_document_root }} is on
      {{ apache24_site_document_mount.stdout | default('unknown') }}, which is not separate from
      the Apache system/configuration filesystem and operating-system root as required.
    success_msg: >-
      V-214290 technical filesystem check passed: document root mount
      {{ apache24_site_document_mount.stdout | trim }} differs from Apache system mount
      {{ apache24_site_system_mount.stdout | trim }} and OS root mount {{ apache24_site_os_mount.stdout | trim }}.
  when: apache24_site_document_root | length > 0
  tags: [V-214290, audit]

- name: "V-214292 | Find directories under the document root"
  ansible.builtin.find:
    paths: "{{ apache24_site_document_root }}"
    file_type: directory
    recurse: true
  register: apache24_site_document_directories
  when: apache24_site_document_root | length > 0
  tags: [V-214292, audit]

- name: "V-214292 | Include document root in directory check"
  ansible.builtin.set_fact:
    apache24_site_directories_to_check: >-
      {{ [apache24_site_document_root] +
         (apache24_site_document_directories.files | default([]) | map(attribute='path') | list) }}
  when: apache24_site_document_root | length > 0
  tags: [V-214292, audit]

- name: "V-214292 | Check for an approved default document in every applicable directory"
  ansible.builtin.find:
    paths: "{{ item }}"
    patterns: "{{ apache24_site_default_documents }}"
    file_type: file
    recurse: false
  loop: "{{ apache24_site_directories_to_check | default([]) }}"
  register: apache24_site_default_document_checks
  when: apache24_site_document_root | length > 0
  tags: [V-214292, audit]

- name: "V-214292 | Report directories missing a default document"
  ansible.builtin.set_fact:
    apache24_site_missing_default_documents: >-
      {{ apache24_site_default_document_checks.results | default([])
         | selectattr('matched', 'equalto', 0)
         | map(attribute='item') | list }}
  when: apache24_site_document_root | length > 0
  tags: [V-214292, audit]

- name: "V-214292 | Verify every applicable directory has a default document"
  ansible.builtin.assert:
    that:
      - apache24_site_missing_default_documents | default([]) | length == 0
    fail_msg: >-
      V-214292 finding/review required. These directories do not contain one of the approved
      default documents {{ apache24_site_default_documents }}:
      {{ apache24_site_missing_default_documents | default([]) }}
    success_msg: "V-214292 technical check passed for the configured document root."
  when: apache24_site_document_root | length > 0
  tags: [V-214292, audit]

- name: "V-214289 | Report stable-baseline recovery evidence"
  ansible.builtin.debug:
    msg:
      status: "{{ 'SITE-EVIDENCE-PROVIDED' if apache24_site_baseline_recovery_evidence | length > 0 else 'REVIEW-REQUIRED' }}"
      evidence: "{{ apache24_site_baseline_recovery_evidence }}"
  tags: [V-214289, audit]

- name: "V-214296 | Validate supplied inactive session timeout"
  ansible.builtin.assert:
    that:
      - apache24_site_inactive_timeout_minutes | int > 0
    fail_msg: Supply the application-approved inactivity timeout after determining the applicable STIG/application requirement.
  when: apache24_site_inactive_timeout_minutes is not none
  tags: [V-214296, audit]

- name: "V-214288 | Report cookie-scope evidence"
  ansible.builtin.debug:
    msg:
      status: "{{ 'SITE-EVIDENCE-PROVIDED' if apache24_site_cookie_scope_evidence | length > 0 else 'REVIEW-REQUIRED' }}"
      evidence: "{{ apache24_site_cookie_scope_evidence }}"
      requirement: "Cookie Domain/Path scope must prevent access outside the originating server/application."
  tags: [V-214288, audit]

- name: "V-214304 | Report approved ports/modules boundary"
  ansible.builtin.debug:
    msg:
      approved_ports: "{{ apache24_site_approved_ports }}"
      approved_modules: "{{ apache24_site_approved_modules }}"
      ppsm_reference: "{{ apache24_site_ppsm_approval_reference }}"
      requirement: "The site must restrict nonsecure/unnecessary ports, protocols, modules, and services; nonstandard use requires site authorization."
  tags: [V-214304, audit]

- name: "V-214280 | Report application user-management boundary"
  ansible.builtin.debug:
    msg:
      status: "{{ 'SITE-EVIDENCE-PROVIDED' if apache24_site_user_management_evidence | length > 0 else 'REVIEW-REQUIRED' }}"
      evidence: "{{ apache24_site_user_management_evidence }}"
  tags: [V-214280, audit]

- name: "V-214282 | Report script-mapping decision"
  ansible.builtin.debug:
    msg:
      approved_script_aliases: "{{ apache24_site_script_aliases_approved }}"
      note: "Current Site V-214282 overlaps Server V-214244; both V-IDs remain traceable."
  tags: [V-214282, audit]

- name: "V-214298 | Report distinct administrative-account boundary"
  ansible.builtin.debug:
    msg:
      approved_accounts: "{{ apache24_site_approved_admin_accounts }}"
      audit_paths: "{{ apache24_site_admin_audit_paths }}"
      requirement: "The organization must identify and document the administrative account boundary; the role will not invent accounts."
  tags: [V-214298, audit]

- name: "V-214297 | Report organization-defined network restriction boundary"
  ansible.builtin.debug:
    msg:
      blocked_networks: "{{ apache24_site_blocked_networks }}"
      evidence: "{{ apache24_site_network_restriction_evidence }}"
      requirement: "Network-zone definitions are organization/site inputs; enforcement may occur outside Apache."
  tags: [V-214297, audit]
