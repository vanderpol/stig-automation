---
- name: Require explicit site document root before Site remediation
  ansible.builtin.assert:
    that:
      - apache24_site_document_root | length > 0
      - apache24_site_document_root.startswith('/')
    fail_msg: Set apache24_site_document_root to the approved absolute document root for this hosted site.

- name: Create Site managed configuration
  ansible.builtin.copy:
    dest: "{{ apache24.site_managed_conf }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by stig-automation - Apache Server 2.4 UNIX Site STIG V2R7
  notify: restart apache

- name: Enable Site managed configuration on Ubuntu
  ansible.builtin.file:
    src: "{{ apache24.site_managed_conf }}"
    dest: /etc/apache2/conf-enabled/01-stig-site.conf
    state: link
  when: ansible_facts.distribution == 'Ubuntu'
  notify: restart apache

- name: "V-214284/V-214292 | Contain site and disable directory indexes"
  ansible.builtin.blockinfile:
    path: "{{ apache24.site_managed_conf }}"
    marker: "# {mark} STIG SITE DOCUMENT ROOT"
    block: |
      <Directory "{{ apache24_site_document_root }}">
          Options -Indexes {{ '-FollowSymLinks' if not apache24_site_follow_symlinks else '+FollowSymLinks' }}
          AllowOverride None
      </Directory>
  notify: restart apache
  tags: [V-214284, V-214292]

- name: "V-214301 | Disable TLS compression"
  ansible.builtin.blockinfile:
    path: "{{ apache24.site_managed_conf }}"
    marker: "# {mark} STIG SITE TLS"
    block: |
      SSLCompression Off
  notify: restart apache
  tags: [V-214301]

- name: "V-214303 | Require explicit Apache session-cookie name before enforcement"
  ansible.builtin.assert:
    that:
      - apache24_site_session_cookie_name | length > 0
    fail_msg: >-
      V-214303 remediation is opt-in because it changes hosted-application session behavior.
      Set apache24_site_session_cookie_name only when this site uses Apache mod_session and the
      approved SessionCookieName is known.
  when: apache24_site_cookie_secure_enforcement | bool
  tags: [V-214303]

- name: "V-214303 | Enable Apache session modules on Ubuntu when approved"
  ansible.builtin.command: "a2enmod session session_cookie"
  register: apache24_site_session_enable
  changed_when: "'Enabling module' in apache24_site_session_enable.stdout"
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - apache24_site_cookie_secure_enforcement | bool
  notify: restart apache
  tags: [V-214303]

- name: "V-214303 | Configure Apache-managed session cookie security"
  ansible.builtin.blockinfile:
    path: "{{ apache24.site_managed_conf }}"
    marker: "# {mark} STIG SITE SESSION COOKIE"
    block: |
      Session On
      SessionCookieName {{ apache24_site_session_cookie_name }} path=/;httponly;secure
  when: apache24_site_cookie_secure_enforcement | bool
  notify: restart apache
  tags: [V-214303]

- name: Validate Apache configuration after Site remediation
  ansible.builtin.command: "{{ apache24.apachectl }} configtest"
  changed_when: false
