---
apache24_site_stig_audit_only: false

# Site/application values. Empty values intentionally require user decisions/evidence.
apache24_site_document_root: ""
apache24_site_server_name: ""
apache24_site_approved_ports: [80, 443]
apache24_site_ppsm_approval_reference: ""

# PKI material is supplied and maintained by the end user/organization.
apache24_site_pki_enabled: false
apache24_site_client_ca_file: ""
apache24_site_client_ca_approval_reference: ""
apache24_site_rfc5280_validation_evidence: ""
apache24_site_private_key_file: ""
apache24_site_private_key_approved_accounts: []

# Architecture/process evidence.
apache24_site_user_management_evidence: ""
apache24_site_disaster_recovery_evidence: ""
apache24_site_application_tuning_evidence: ""
apache24_site_network_restriction_evidence: ""
apache24_site_script_aliases_approved: []
apache24_site_follow_symlinks: false
apache24_site_indexes_enabled: false
# V-214292 permits index.html or an equivalent default document. Keep this list
# aligned with the site's effective DirectoryIndex policy.
apache24_site_default_documents:
  - index.html
apache24_site_baseline_recovery_evidence: ""
apache24_site_inactive_timeout_minutes: null
apache24_site_blocked_networks: []
apache24_site_admin_audit_paths: []
apache24_site_approved_admin_accounts: []
apache24_site_cookie_secure_enforcement: true
apache24_site_cookie_scope_evidence: ""
apache24_site_tls_compression: "Off"
apache24_site_approved_modules: []
