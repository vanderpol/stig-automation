name: Ansible Syntax Checks

on:
  push:
    paths:
      - 'playbooks/**/*.yml'
      - 'playbooks/**/*.yaml'
      - 'remediation/**/*.yml'
      - 'remediation/**/*.yaml'
      - 'inventories/**/*.yml'
      - 'inventories/**/*.yaml'
      - '.github/workflows/ansible-syntax.yml'
  pull_request:
    paths:
      - 'playbooks/**/*.yml'
      - 'playbooks/**/*.yaml'
      - 'remediation/**/*.yml'
      - 'remediation/**/*.yaml'
      - 'inventories/**/*.yml'
      - 'inventories/**/*.yaml'
      - '.github/workflows/ansible-syntax.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible Core
        run: python -m pip install 'ansible-core>=2.18,<2.20'

      - name: Show Ansible version
        run: ansible-playbook --version

      - name: Discover Ansible playbooks
        shell: bash
        run: |
          set -euo pipefail
          find playbooks -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort | tee /tmp/ansible-playbooks.txt
          test -s /tmp/ansible-playbooks.txt

      - name: Syntax check every playbook
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r playbook; do
            echo "::group::Syntax check: $playbook"
            if ansible-playbook --syntax-check "$playbook"; then
              echo "PASS: $playbook"
            else
              echo "FAIL: $playbook"
              failed=1
            fi
            echo "::endgroup::"
          done < /tmp/ansible-playbooks.txt

          if [[ "$failed" -ne 0 ]]; then
            echo "One or more Ansible playbooks failed syntax validation."
            exit 1
          fi
