name: PostgreSQL 16 Ansible Syntax

on:
  push:
    branches:
      - postgres16-v1r3
    paths:
      - 'playbooks/postgresql16_*.yml'
      - 'remediation/postgresql/postgresql16/**'
      - 'inventories/lab/hosts.postgresql16.example.yml'
      - 'inventories/lab/group_vars/postgresql16.yml.example'
      - '.github/workflows/postgresql16-ansible-syntax.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible Core
        run: python -m pip install 'ansible-core>=2.18,<2.20'

      - name: Show Ansible version
        run: ansible-playbook --version

      - name: Syntax check PostgreSQL 16 preflight
        run: ansible-playbook --syntax-check playbooks/postgresql16_preflight.yml

      - name: Syntax check PostgreSQL 16 remediation
        run: ansible-playbook --syntax-check playbooks/postgresql16_stig.yml
